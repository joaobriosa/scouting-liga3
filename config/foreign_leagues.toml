# Foreign leagues that count as "promotion" for the target variable.
# Decided by the project owner on 2026-11-13.
#
# Group A  counts as promotion (same 450-minute rule as Liga 2 / I Liga, summed
#          over seasons s+1 and s+2).
# Group B  doubtful: target_observed = False, excluded from training.
# Group C  does not count as promotion.
#
# Rules, applied in this order (revised 2026-11-13):
#   1. tier >= 3 in any country                                    -> C
#   2. UEFA country rank <= 30: tier 1                              -> A
#   3. England, Spain, Germany, Italy, France: tier 2               -> A
#   4. UEFA country rank 16-30: tier 2                              -> C
#   5. UEFA country rank > 30 (tiers 1 and 2)                       -> C  (no request needed)
#   6. non-UEFA countries in `non_uefa_group_a`: tier 1 -> A, tier >= 2 -> B
#   7. other non-UEFA countries (e.g. Indonesia, Qatar, Angola)     -> B  (no request needed)
#   8. remaining case: tier 2 of ranks 1-15 outside the big 5       -> B

[ranking]
source = "UEFA country coefficients ranking 2024 (end of 2023/24), kassiesa.net"
url = "https://kassiesa.net/uefa/data/method5/crank2024.html"
# Country codes as used by zerozero flags (ISO 3166-1 alpha-2; UK nations GB-XXX).
order = [
  "GB-ENG", "IT", "ES", "DE", "FR", "NL", "PT", "BE", "TR", "CZ",
  "GB-SCT", "CH", "AT", "NO", "GR", "DK", "IL", "UA", "RS", "HR",
  "PL", "RU", "CY", "HU", "SE", "RO", "BG", "AZ", "SK", "SI",
  "MD", "XK", "KZ", "FI", "IE", "AM", "LV", "FO", "BA", "LI",
  "IS", "GB-NIR", "LU", "LT", "MT", "GE", "AL", "EE", "BY", "MK",
  "AD", "GB-WLS", "ME", "GI", "SM",
]

[calendar_year]
# Countries whose leagues run in the calendar year. zerozero labels their career
# rows "2025" and files them under the epoca_id of 2024/25. Owner decision
# (2026-11-14): calendar year Y -> season Y/Y+1 (largest overlap). Rows of other
# countries shown under a year label (e.g. a Portuguese club in the same epoca)
# take the season of their epoca_id. List derived from the career table: countries
# with year-labelled rows on their own (no other country in that year).
countries = [
  "AO", "AR", "BO", "BR", "BY", "CA", "CL", "CM", "CN", "CO", "CV", "DO", "EC",
  "EE", "FI", "FO", "GE", "GM", "GQ", "IE", "IS", "JP", "KG", "KR", "KZ", "LT",
  "LV", "MO", "MZ", "NO", "NZ", "PY", "SE", "ST", "US", "UY", "VE", "ZM",
]

[groups]
top_rank = 15            # tier 2 of ranks <= 15 (outside the big 5) -> B
tier1_a_max_rank = 30    # tier 1 of countries ranked <= 30 -> A
low_rank_c = 30          # countries ranked > 30: tiers 1-2 -> C; ranks 16-30: tier 2 -> C
big5_second_tier_a = ["GB-ENG", "ES", "DE", "IT", "FR"]
non_uefa_group_a = ["US", "MX", "BR", "AR", "SA", "JP"]   # their tier 1 -> A

# League name (as on zerozero) -> tier, per country, for 2022/23-2025/26.
