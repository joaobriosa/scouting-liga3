# Opta league ratings used by the target variable: TEMPLATE, ratings not included.
#
# Copy this file to config/opta_leagues.toml and fill in the values yourself.
#
# Rule: a destination league counts as "promotion" if its Opta Power Rankings
# average team rating (league rankings, column OVERALL) is >= the rating of
# Liga Portugal 2 (the Portuguese second tier). I Liga and Liga Portugal 2
# always count. Leagues without a rating, or not mapped below, count as below.
#
# Where the numbers come from: Opta Power Rankings by Stats Perform / The Analyst,
#   https://dataviz.theanalyst.com/opta-power-rankings/?leagueRankings=true
# The original project used a single snapshot (2026-11-13) for every season.
#
# Why they are not included: the Stats Perform terms of use allow personal,
# non-commercial use only and do not allow republishing the data. This public
# copy therefore ships the structure and the zerozero -> Opta league mapping,
# but none of the ratings. Read them on the page above and write them in.

[meta]
snapshot_date = "YYYY-MM-DD"               # date you read the rankings
season_of_ratings = "YYYY/YY"
threshold_league = "Portuguese Segunda Liga"
# threshold = <rating of "Portuguese Segunda Liga">
# sensitivity_thresholds = [<threshold - x>, <threshold + x>]

# Opta league name -> average team rating (OVERALL). Fill in each value (listed alphabetically).
